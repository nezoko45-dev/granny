name: Add player respawn
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  respawn:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Granny for respawning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function restart(){camera.position.set(0,1.7,18);camera.rotation.set(0,0,0);if(isHost){granny.position.set(0,0,-24);roaming=true;randomRoamTarget()}player.hidden=false;player.gameOver=false;chasing=false;chaseLeft=0;path=[];pathIndex=0;lastMove=0;started=true;renderer.domElement.requestPointerLock();if(isHost)sendAll({type:'granny',x:0,z:-24,chasing:false,roaming:true,timer:0})}"
          new="function respawnPlayer(){camera.position.set(0,1.7,18);camera.rotation.set(0,0,0);player.hidden=false;player.gameOver=false;chasing=false;chaseLeft=0;path=[];pathIndex=0;lastMove=performance.now();started=true;renderer.domElement.requestPointerLock();if(peer&&peer.open&&!isHost)sendAll({type:'data',data:{type:'respawn'}})}\nfunction restart(){respawnPlayer()}"
          if old in s:
              s=s.replace(old,new)
          else:
              raise SystemExit('restart function not found')
          old2="if(d<1.25){player.gameOver=true;chasing=false;roaming=false}"
          new2="if(d<1.25){player.gameOver=true;chasing=false;roaming=false;setTimeout(()=>{if(player.gameOver)respawnPlayer()},3000)}"
          if old2 in s:
              s=s.replace(old2,new2)
          else:
              raise SystemExit('catch block not found')
          p.write_text(s)
          PY
      - name: Commit respawn changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add automatic player respawn'
          git push
