name: Fix Granny strafing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch the actual module AI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the broken patch that was accidentally inserted into the
          # external PeerJS <script src=...> tag. Inline code there is ignored.
          peer_open = '<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js">'
          peer_clean = '<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>'
          if peer_open in s:
              a = s.find(peer_open)
              b = s.find('</script>', a)
              if b < 0:
                  raise SystemExit('PeerJS script has no closing tag')
              bad_block = s[a:b+len('</script>')]
              if 'grannyMovementStrafeFix' in bad_block:
                  s = s[:a] + peer_clean + s[b+len('</script>'):]

          module = s.find('<script type="module">')
          if module < 0:
              raise SystemExit('Module script not found')
          start = s.find('function ai(dt){', module)
          if start < 0:
              raise SystemExit('Actual module ai(dt) not found')

          # Find the matching closing brace of the real ai() function.
          depth = 0
          end = None
          quote = None
          escape = False
          line_comment = False
          block_comment = False
          i = start
          while i < len(s):
              ch = s[i]
              nx = s[i+1] if i + 1 < len(s) else ''
              if line_comment:
                  if ch == '\n': line_comment = False
              elif block_comment:
                  if ch == '*' and nx == '/':
                      block_comment = False
                      i += 1
              elif quote:
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == quote:
                      quote = None
              else:
                  if ch == '/' and nx == '/':
                      line_comment = True
                      i += 1
                  elif ch == '/' and nx == '*':
                      block_comment = True
                      i += 1
                  elif ch in "'\"`":
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              i += 1
          if end is None:
              raise SystemExit('Could not find end of actual ai(dt)')

          new_ai = r'''function ai(dt){
            if(!isHost||!started)return;
            const d=distance();
            const sees=lineOfSight();
            const hears=hear();
            if((sees||hears)&&!player.hidden){chasing=true;chaseLeft=11;}
            if(chasing){chaseLeft-=dt;if(chaseLeft<=0){chasing=false;roaming=true;randomRoamTarget();}}

            // Granny follows a sampled destination, not the player's current
            // lateral velocity. This prevents A/D strafing from being copied.
            if(!granny.userData.chaseTarget)granny.userData.chaseTarget=new THREE.Vector3();
            if(granny.userData.targetClock===undefined)granny.userData.targetClock=0;
            const target=granny.userData.chaseTarget;
            if(!chasing){
              if(!roaming||Math.hypot(granny.position.x-roamTarget.x,granny.position.z-roamTarget.z)<.7){roaming=true;randomRoamTarget();}
              target.copy(roamTarget);
              granny.userData.targetClock=0;
            }else{
              granny.userData.targetClock-=dt;
              if(granny.userData.targetClock<=0){
                target.set(camera.position.x,0,camera.position.z);
                granny.userData.targetClock=.7;
              }
            }

            pathClock-=dt;
            if(pathClock<=0||!path.length||pathIndex>=path.length){
              path=astar(granny.position,target);
              pathIndex=0;
              pathClock=.35;
            }
            const node=path[pathIndex];
            if(node){
              const dx=node.x-granny.position.x,dz=node.z-granny.position.z,len=Math.hypot(dx,dz);
              if(len<.45)pathIndex++;
              else{
                const speed=chasing?4.2:1.65;
                granny.position.x+=dx/len*speed*dt;
                granny.position.z+=dz/len*speed*dt;
                granny.rotation.y=Math.atan2(dx,dz);
                animateGrannyWalking(true,dt);
              }
            }else animateGrannyWalking(false,dt);

            if(d<1.25&&!player.hidden&&!player.gameOver){
              player.gameOver=true;
              chasing=false;
              roaming=true;
              randomRoamTarget();
              setTimeout(()=>{if(player.gameOver)respawnPlayer()},3000);
            }
            sendAll({type:'granny',x:granny.position.x,z:granny.position.z,chasing,roaming,timer:chaseLeft});
          }'''

          s = s[:start] + new_ai + s[end:]

          # Hard validation: exactly one real ai(), no stale bad patch marker,
          # and the AI is inside the module script.
          if s.count('function ai(dt){') != 1:
              raise SystemExit('Validation failed: ai(dt) count is not 1')
          if 'grannyMovementStrafeFix' in s:
              raise SystemExit('Validation failed: stale strafing patch remains')
          if peer_open in s:
              raise SystemExit('Validation failed: malformed PeerJS tag remains')
          if s.find('function ai(dt){') < module:
              raise SystemExit('Validation failed: ai() is outside module script')

          p.write_text(s, encoding='utf-8')
          print('Validated Granny AI patch successfully')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Granny strafe mirroring'
          git push
