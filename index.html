<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Granny — Multiplayer</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#070504;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000}#status{position:absolute;top:15px;left:15px;font-size:20px;font-weight:bold}#players{position:absolute;top:15px;right:15px;font-size:15px}#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff}#cross:before{width:14px;height:2px;top:6px}#cross:after{width:2px;height:14px;left:6px}#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#000c;padding:9px 13px;border-radius:7px;font-size:14px;white-space:nowrap}#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;color:#fff;z-index:5}#panel{background:#160e0b;border:2px solid #fff;border-radius:10px;padding:25px;text-align:center;min-width:290px}#panel button{font-size:18px;padding:11px 20px;margin-top:14px;border-radius:6px;border:1px solid #777;cursor:pointer}.hidden{display:none!important}</style></head><body><div id="start"><div id="panel"><div style="font-size:28px;font-weight:bold">GRANNY</div><div style="margin-top:8px">16-player multiplayer horror</div><button id="play">PLAY</button><div id="room" style="margin-top:15px;font-size:14px">Connecting to server...</div></div></div><div id="hud"><div id="status">CONNECTING...</div><div id="players">PLAYERS 0/16</div><div id="cross"></div><div id="help">WASD MOVE · SHIFT SPRINT · MOUSE LOOK</div></div><script type="module" src="/game.js"></script></body></html>
