<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Granny 3D</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505;font-family:Arial,sans-serif}#renderCanvas{width:100%;height:100%;touch-action:none;display:block}#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #000}#status{position:absolute;top:15px;left:15px;font-size:20px;font-weight:bold}#timer{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:bold}#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 13px;border-radius:7px;font-size:14px}#error{display:none;position:fixed;inset:0;background:#120707;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px;z-index:5}</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="hud"><div id="status">QUIET</div><div id="timer"></div><div id="help">WASD / ARROWS MOVE · SHIFT SPRINT · E HIDE · R RESTART · CLICK TO LOOK</div></div>
<div id="error">3D engine failed to load. Refresh the page and try again.</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
'use strict';
const error=document.getElementById('error');
if(!window.BABYLON){error.style.display='flex';throw new Error('Babylon.js failed to load');}
const canvas=document.getElementById('renderCanvas');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true});
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.025,.02,.018,1);
const camera=new BABYLON.UniversalCamera('PlayerCamera',new BABYLON.Vector3(0,2,18),scene);
camera.attachControl(canvas,true);camera.speed=.16;camera.angularSensibility=4000;camera.minZ=.1;camera.ellipsoid=new BABYLON.Vector3(.45,1,.45);camera.checkCollisions=true;
scene.activeCamera=camera;scene.gravity=new BABYLON.Vector3(0,-.3,0);scene.collisionsEnabled=true;
const light=new BABYLON.HemisphericLight('Moon',new BABYLON.Vector3(0,1,0),scene);light.intensity=.55;
const lamp=new BABYLON.PointLight('Lamp',new BABYLON.Vector3(0,6,0),scene);lamp.intensity=80;lamp.range=55;
function mat(name,color){const m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(color);return m}
const floorMat=mat('old wood','#46362f'),wallMat=mat('walls','#66534b'),darkMat=mat('furniture','#292020'),doorMat=mat('doors','#51382d'),grannyMat=mat('granny dress','#4d714b'),skinMat=mat('skin','#c9978d');
function box(name,x,y,z,w,h,d,material,collide=true){const b=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);b.position.set(x,y,z);b.material=material;b.checkCollisions=collide;return b}
box('Floor',0,-.15,-10,52,.3,70,floorMat,false);
const walls=[];
function wall(x,z,w,d){walls.push(box('Wall',x,2.5,z,w,5,d,wallMat,true));}
wall(-26,-10,1,70);wall(26,-10,1,70);wall(0,25,52,1);wall(0,-45,52,1);
wall(-12,5,1,20);wall(12,5,1,20);wall(-12,-20,1,28);wall(12,-20,1,28);
wall(-7,-10,10,1);wall(7,-10,10,1);wall(-15,-32,18,1);wall(15,-32,18,1);wall(0,-39,18,1);wall(-20,-25,10,1);wall(20,-25,10,1);
function furniture(x,z,w,d,h=2){return box('Furniture',x,h/2,z,w,h,d,darkMat,true)}
furniture(-7,-2,4,2);furniture(7,-2,4,2);furniture(-18,-18,4,2);furniture(18,-18,4,2);furniture(0,-29,5,2);
// Doors are openings represented by thin decorative frames; E toggles hiding in nearby closets.
function door(x,z,w,rot=0){const d=box('Door',x,1.7,z,w,3.4,.25,doorMat,false);d.rotation.y=rot;return d}
door(0,9,3);door(-12,-5,3,Math.PI/2);door(12,-5,3,Math.PI/2);door(0,-25,3);
// Granny
const granny=new BABYLON.TransformNode('Granny',scene);granny.position=new BABYLON.Vector3(0,0,-24);
const body=BABYLON.MeshBuilder.CreateCylinder('GrannyBody',{height:2.1,diameterTop:.8,diameterBottom:1.15},scene);body.parent=granny;body.position.y=1.05;body.material=grannyMat;
const head=BABYLON.MeshBuilder.CreateSphere('GrannyHead',{diameter:.85},scene);head.parent=granny;head.position.y=2.45;head.material=skinMat;
const eyeMat=mat('eyes','#9d1111');
for(const x of [-.14,.14]){const e=BABYLON.MeshBuilder.CreateSphere('Eye',{diameter:.09},scene);e.parent=granny;e.position.set(x,.03,2.55);e.material=eyeMat;}
granny.rotationQuaternion=null;
const player={hidden:false,chasing:false,chaseLeft:0,lastMove:0};
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')restart();if(e.code==='KeyE')toggleHide();});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
function dist(){return BABYLON.Vector3.Distance(camera.position,granny.position)}
function lineOfSight(){const a=camera.position.clone();a.y=1.7;const b=granny.position.clone();b.y=1.7;const dir=b.subtract(a);const ray=new BABYLON.Ray(a,dir.normalize(),dir.length());const hit=scene.pickWithRay(ray,m=>m.checkCollisions&&m!==body&&m!==head&&!m.name.startsWith('Eye'));return !hit.hit}
function hear(){return !player.hidden&&(performance.now()-player.lastMove<180)&&dist()<48}
function toggleHide(){if(Math.abs(camera.position.x)<4&&camera.position.z>-35&&camera.position.z<-27){player.hidden=!player.hidden;camera.position.y=player.hidden?1.25:2;}}
function chase(){player.chasing=true;player.chaseLeft=11;}
// Grid A* navigation across the house. Cells blocked by walls/furniture are avoided.
const CELL=2,MINX=-24,MAXX=24,MINZ=-43,MAXZ=23;
const cols=Math.floor((MAXX-MINX)/CELL)+1,rows=Math.floor((MAXZ-MINZ)/CELL)+1;
function blocked(x,z){for(const w of walls){if(Math.abs(x-w.position.x)<w.scaling.x*0.5+.8&&Math.abs(z-w.position.z)<w.scaling.z*0.5+.8)return true;}return false}
function node(x,z){return {x,z,g:0,h:0,f:0,p:null}}
function astar(start,target){const sx=Math.round((start.x-MINX)/CELL),sz=Math.round((start.z-MINZ)/CELL),tx=Math.round((target.x-MINX)/CELL),tz=Math.round((target.z-MINZ)/CELL);const open=[],closed=new Set();const s=node(sx,sz);s.h=Math.abs(sx-tx)+Math.abs(sz-tz);s.f=s.h;open.push(s);let guard=0;while(open.length&&guard++<2500){open.sort((a,b)=>a.f-b.f);const cur=open.shift();const key=cur.x+','+cur.z;if(closed.has(key))continue;closed.add(key);if(cur.x===tx&&cur.z===tz){const path=[];let p=cur;while(p){path.unshift({x:MINX+p.x*CELL,z:MINZ+p.z*CELL});p=p.p;}return path;}for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cur.x+dx,nz=cur.z+dz;if(nx<0||nz<0||nx>=cols||nz>=rows)continue;const wx=MINX+nx*CELL,wz=MINZ+nz*CELL;if(blocked(wx,wz))continue;const n=node(nx,nz);n.g=cur.g+1;n.h=Math.abs(nx-tx)+Math.abs(nz-tz);n.f=n.g+n.h;n.p=cur;open.push(n);}}return []}
let path=[],pathIndex=0,pathClock=0;
function updateAI(dt){
 if(player.hidden){player.chasing=false;player.chaseLeft=0;return;}
 const d=dist();
 if(hear())chase();
 if(!player.chasing&&d<38&&lineOfSight())chase();
 if(player.chasing){player.chaseLeft-=dt;if(player.chaseLeft<=0){player.chasing=false;path=[];}}
 if(!player.chasing)return;
 pathClock-=dt;
 if(pathClock<=0||pathIndex>=path.length){path=astar(granny.position,camera.position);pathIndex=1;pathClock=.45;}
 const target=path[pathIndex];if(target){const dx=target.x-granny.position.x,dz=target.z-granny.position.z,len=Math.hypot(dx,dz)||1;const speed=4.2;granny.position.x+=dx/len*speed*dt;granny.position.z+=dz/len*speed*dt;granny.rotation.y=Math.atan2(dx,dz);if(Math.hypot(dx,dz)<.7)pathIndex++;}
 if(d<1.25){gameOver=true;player.chasing=false;}
}
let gameOver=false;
function restart(){camera.position.set(0,2,18);granny.position.set(0,0,-24);player.hidden=false;player.chasing=false;player.chaseLeft=0;path=[];pathIndex=0;gameOver=false;}
scene.onBeforeRenderObservable.add(()=>{
 const dt=Math.min(.05,engine.getDeltaTime()/1000);
 if(!gameOver&&!player.hidden){const moving=keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight;if(moving)player.lastMove=performance.now();camera.speed=(keys.ShiftLeft||keys.ShiftRight)?.28:.16;}
 if(!gameOver){updateAI(dt);}
 document.getElementById('status').textContent=gameOver?'GRANNY CAUGHT YOU — PRESS R':player.hidden?'HIDDEN':player.chasing?'GRANNY IS CHASING YOU!':(performance.now()-player.lastMove<180?'GRANNY HEARD YOU':'QUIET');
 document.getElementById('timer').textContent=player.chasing?'CHASE: '+Math.max(0,player.chaseLeft).toFixed(1)+'s':'';
});
engine.runRenderLoop(()=>scene.render());
addEventListener('resize',()=>engine.resize());
</script>
</body>
</html>
