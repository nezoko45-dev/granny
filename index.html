<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Granny 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial}#renderCanvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000}#status{position:absolute;top:15px;left:15px;font-size:20px;font-weight:bold}#timer{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:bold}#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 13px;border-radius:7px;font-size:14px}.cross{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{width:12px;height:2px;top:5px}.cross:after{width:2px;height:12px;left:5px}</style></head><body><canvas id="renderCanvas"></canvas><div id="hud"><div id="status">QUIET</div><div id="timer"></div><div class="cross"></div><div id="help">WASD / ARROWS MOVE · SHIFT SPRINT · E HIDE · R RESTART · CLICK TO LOOK</div></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script>
'use strict';
const canvas=document.getElementById('renderCanvas');const engine=new BABYLON.Engine(canvas,true);const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.015,.012,.01,1);scene.collisionsEnabled=true;
const camera=new BABYLON.UniversalCamera('Player',new BABYLON.Vector3(0,1.7,18),scene);camera.minZ=.1;camera.speed=0;camera.checkCollisions=false;scene.activeCamera=camera;
const hemi=new BABYLON.HemisphericLight('Hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.8;const lamp=new BABYLON.PointLight('Lamp',new BABYLON.Vector3(0,6,0),scene);lamp.intensity=120;lamp.range=60;
function material(name,hex){const m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(hex);m.emissiveColor=BABYLON.Color3.FromHexString(hex).scale(.12);return m}const floorMat=material('Wood','#8a5a38'),wallMat=material('Wall','#b08b72'),furnMat=material('Furniture','#35231c'),doorMat=material('Door','#7b3f25'),dressMat=material('Granny Dress','#3d8b46'),skinMat=material('Skin','#e0a18f'),redMat=material('Eyes','#ff2020');
function box(n,x,y,z,w,h,d,m,collide=true){const b=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);b.position.set(x,y,z);b.material=m;b.checkCollisions=collide;return b}box('Floor',0,-.15,-10,52,.3,70,floorMat,false);const walls=[];function wall(x,z,w,d){walls.push(box('Wall',x,2.5,z,w,5,d,wallMat,true))}wall(-26,-10,1,70);wall(26,-10,1,70);wall(0,25,52,1);wall(0,-45,52,1);wall(-12,5,1,20);wall(12,5,1,20);wall(-12,-20,1,28);wall(12,-20,1,28);wall(-7,-10,10,1);wall(7,-10,10,1);wall(-15,-32,18,1);wall(15,-32,18,1);wall(0,-39,18,1);wall(-20,-25,10,1);wall(20,-25,10,1);
box('Table',-7,1,-2,4,2,2,furnMat,true);box('Table',7,1,-2,4,2,2,furnMat,true);box('Cabinet',-18,1,-18,4,2,2,furnMat,true);box('Cabinet',18,1,-18,4,2,2,furnMat,true);box('Closet',0,1,-29,5,2,2,furnMat,true);
function door(x,z,w,r=0){const d=box('Door',x,1.7,z,w,3.4,.25,doorMat,false);d.rotation.y=r}door(0,9,3);door(-12,-5,3,Math.PI/2);door(12,-5,3,Math.PI/2);door(0,-25,3);
const granny=new BABYLON.TransformNode('Granny',scene);granny.position.set(0,0,-24);const body=BABYLON.MeshBuilder.CreateCylinder('Body',{height:2.1,diameterTop:.8,diameterBottom:1.15},scene);body.parent=granny;body.position.y=1.05;body.material=dressMat;const head=BABYLON.MeshBuilder.CreateSphere('Head',{diameter:.85},scene);head.parent=granny;head.position.y=2.45;head.material=skinMat;for(const x of[-.14,.14]){const e=BABYLON.MeshBuilder.CreateSphere('Eye',{diameter:.1},scene);e.parent=granny;e.position.set(x,-.02,2.55);e.material=redMat}granny.rotationQuaternion=null;
const keys={};let gameOver=false,hidden=false,chasing=false,chaseLeft=0,lastMove=0,path=[],pathIndex=0,pathClock=0;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')restart();if(e.code==='KeyE')toggleHide()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));canvas.addEventListener('click',()=>canvas.requestPointerLock?.());document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){camera.rotation.y+=e.movementX*.002;camera.rotation.x=Math.max(-1.45,Math.min(1.45,camera.rotation.x+e.movementY*.002))}});
function hit(x,z,r=.42){for(const w of walls){if(Math.abs(x-w.position.x)<w.getBoundingInfo().boundingBox.extendSize.x+r&&Math.abs(z-w.position.z)<w.getBoundingInfo().boundingBox.extendSize.z+r)return true}return false}function movePlayer(dt){if(gameOver||hidden)return;let x=(keys.KeyD?1:0)-(keys.KeyA?1:0),z=(keys.KeyS?1:0)-(keys.KeyW?1:0);if(!x&&!z)return;const len=Math.hypot(x,z);x/=len;z/=len;const f=new BABYLON.Vector3(Math.sin(camera.rotation.y),0,Math.cos(camera.rotation.y));const right=new BABYLON.Vector3(Math.cos(camera.rotation.y),0,-Math.sin(camera.rotation.y));const dir=f.scale(z).add(right.scale(x));const speed=(keys.ShiftLeft||keys.ShiftRight)?7:4;const nx=camera.position.x+dir.x*speed*dt,nz=camera.position.z+dir.z*speed*dt;if(!hit(nx,camera.position.z))camera.position.x=nx;if(!hit(camera.position.x,nz))camera.position.z=nz;camera.position.x=Math.max(-25,Math.min(25,camera.position.x));camera.position.z=Math.max(-44,Math.min(24,camera.position.z));lastMove=performance.now()}
function dist(){return Math.hypot(camera.position.x-granny.position.x,camera.position.z-granny.position.z)}function lineOfSight(){const a=new BABYLON.Vector3(camera.position.x,1.7,camera.position.z),b=new BABYLON.Vector3(granny.position.x,1.7,granny.position.z),v=b.subtract(a),d=v.length();if(d>38)return false;const ray=new BABYLON.Ray(a,v.normalize(),d);const h=scene.pickWithRay(ray,m=>m.checkCollisions&&m!==body&&m!==head&&!m.name.startsWith('Eye'));return !h.hit}function hear(){return !hidden&&performance.now()-lastMove<180&&dist()<48}function toggleHide(){if(Math.abs(camera.position.x)<4&&camera.position.z>-35&&camera.position.z<-27){hidden=!hidden;camera.position.y=hidden?1.25:1.7}}
const CELL=2,MINX=-24,MAXX=24,MINZ=-43,MAXZ=23,cols=25,rows=34;function blocked(x,z){return hit(x,z,.15)}function astar(start,target){const sx=Math.max(0,Math.min(cols-1,Math.round((start.x-MINX)/CELL))),sz=Math.max(0,Math.min(rows-1,Math.round((start.z-MINZ)/CELL))),tx=Math.max(0,Math.min(cols-1,Math.round((target.x-MINX)/CELL))),tz=Math.max(0,Math.min(rows-1,Math.round((target.z-MINZ)/CELL)));const open=[{x:sx,z:sz,g:0,h:0,f:0,p:null}],closed=new Set();let guard=0;while(open.length&&guard++<3000){open.sort((a,b)=>a.f-b.f);const c=open.shift(),k=c.x+','+c.z;if(closed.has(k))continue;closed.add(k);if(c.x===tx&&c.z===tz){const out=[];for(let p=c;p;p=p.p)out.unshift({x:MINX+p.x*CELL,z:MINZ+p.z*CELL});return out}for(const [dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]]){const x=c.x+dx,z=c.z+dz;if(x<0||z<0||x>=cols||z>=rows||blocked(MINX+x*CELL,MINZ+z*CELL))continue;open.push({x,z,g:c.g+1,h:Math.abs(x-tx)+Math.abs(z-tz),f:c.g+1+Math.abs(x-tx)+Math.abs(z-tz),p:c})}}return[]}
function ai(dt){if(hidden){chasing=false;return}const d=dist();if(hear()||(!chasing&&d<38&&lineOfSight())){chasing=true;chaseLeft=11}if(chasing){chaseLeft-=dt;if(chaseLeft<=0){chasing=false;path=[]}pathClock-=dt;if(pathClock<=0||pathIndex>=path.length){path=astar(granny.position,camera.position);pathIndex=1;pathClock=.35}const t=path[pathIndex];if(t){const dx=t.x-granny.position.x,dz=t.z-granny.position.z,l=Math.hypot(dx,dz)||1;granny.position.x+=dx/l*4.2*dt;granny.position.z+=dz/l*4.2*dt;granny.rotation.y=Math.atan2(dx,dz);if(Math.hypot(dx,dz)<.7)pathIndex++}}if(d<1.25){gameOver=true;chasing=false}}
function restart(){camera.position.set(0,1.7,18);camera.rotation.set(0,0,0);granny.position.set(0,0,-24);hidden=false;chasing=false;chaseLeft=0;path=[];pathIndex=0;gameOver=false;lastMove=0}
scene.onBeforeRenderObservable.add(()=>{const dt=Math.min(.05,engine.getDeltaTime()/1000);movePlayer(dt);ai(dt);document.getElementById('status').textContent=gameOver?'GRANNY CAUGHT YOU — PRESS R':hidden?'HIDDEN':chasing?'GRANNY IS CHASING YOU!':performance.now()-lastMove<180?'GRANNY HEARD YOU':'QUIET';document.getElementById('timer').textContent=chasing?'CHASE: '+Math.max(0,chaseLeft).toFixed(1)+'s':''});engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
</script></body></html>
