<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRANNY - House Hunt</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080706;color:#fff;font-family:Arial,sans-serif}#game{display:block;width:100%;height:100%;image-rendering:auto}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090706;z-index:5}#box{background:#19110e;border:2px solid #5b4035;padding:32px;text-align:center;border-radius:14px;max-width:560px}button{font-size:22px;padding:14px 28px;border:0;border-radius:8px;cursor:pointer}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}#status{position:absolute;top:15px;left:18px;font-size:20px;font-weight:bold}#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 14px;border-radius:8px;white-space:nowrap}#map{position:absolute;right:15px;top:15px;width:190px;height:150px;background:#000b;border:1px solid #755b4f}</style></head><body><canvas id="game"></canvas><div id="menu"><div id="box"><h1>GRANNY</h1><h2>HOUSE HUNT</h2><p>WASD moves you through the house. Granny hears you moving and chases for 11 seconds.</p><p><b>WASD</b> move · <b>SHIFT</b> run · <b>E</b> open doors / hide · <b>R</b> restart</p><button id="start">ENTER THE HOUSE</button></div></div><div id="hud"><div id="status">Ready</div><div id="help">W A S D = MOVE | SHIFT = RUN | E = INTERACT | R = RESTART</div><canvas id="map" width="190" height="150"></canvas></div><script>
'use strict';
/* PURE HTML CANVAS VERSION. ZERO EXTERNAL LIBRARIES. */
const c=document.getElementById('game'),x=c.getContext('2d'),mm=document.getElementById('map'),mx=mm.getContext('2d'),status=document.getElementById('status');let W=0,H=0,dpr=1;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
const S=42,C=40,R=30,grid=Array.from({length:R},()=>Array(C).fill(1));
function room(a,b,w,h){for(let j=b;j<b+h;j++)for(let i=a;i<a+w;i++)if(i>0&&j>0&&i<C-1&&j<R-1)grid[j][i]=0}
room(2,2,8,7);room(14,2,10,7);room(28,2,9,7);room(2,12,10,7);room(14,12,10,7);room(28,12,9,7);room(2,22,10,6);room(14,22,10,6);room(28,22,9,6);
for(let i=10;i<14;i++)grid[5][i]=0;for(let i=24;i<28;i++)grid[5][i]=0;for(let i=12;i<14;i++)grid[15][i]=0;for(let i=24;i<28;i++)grid[15][i]=0;for(let i=12;i<14;i++)grid[25][i]=0;for(let i=24;i<28;i++)grid[25][i]=0;for(let j=9;j<12;j++){grid[j][6]=0;grid[j][19]=0;grid[j][32]=0}for(let j=19;j<22;j++){grid[j][6]=0;grid[j][19]=0;grid[j][32]=0}
const rooms=[['Entrance',2,2,8,7],['Foyer',14,2,10,7],['Kitchen',28,2,9,7],['Living',2,12,10,7],['Dining',14,12,10,7],['Library',28,12,9,7],['Bedroom A',2,22,10,6],['Bedroom B',14,22,10,6],['Basement',28,22,9,6]];
const doors=[{a:10,b:5,o:0},{a:24,b:5,o:0},{a:12,b:15,o:0},{a:24,b:15,o:0},{a:12,b:25,o:0},{a:24,b:25,o:0},{a:6,b:9,o:0},{a:19,b:9,o:0},{a:32,b:9,o:0},{a:6,b:19,o:0},{a:19,b:19,o:0},{a:32,b:19,o:0}];
function doorAt(a,b){return doors.find(d=>d.a===a&&d.b===b)}function blocked(a,b){if(a<0||b<0||a>=C||b>=R)return true;const d=doorAt(a,b);return d?!d.o:grid[b][a]===1}
const p={px:6.5*S,py:5*S,r:12,speed:185,hidden:false,moving:false};const g={px:19*S,py:15*S,r:15,speed:118,mode:'search',until:0,path:[],pi:0,room:0};
let keys=Object.create(null),playing=false,dead=false,last=performance.now(),noise=0;
addEventListener('keydown',e=>{keys[e.code]=true;if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyE')interact();if(e.code==='KeyR')reset()},{passive:false});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>keys=Object.create(null));
function hit(px,py,r){const l=Math.floor((px-r)/S),h=Math.floor((px+r)/S),t=Math.floor((py-r)/S),b=Math.floor((py+r)/S);for(let j=t;j<=b;j++)for(let i=l;i<=h;i++)if(blocked(i,j)){const qx=Math.max(i*S,Math.min(px,(i+1)*S)),qy=Math.max(j*S,Math.min(py,(j+1)*S));if((px-qx)**2+(py-qy)**2<r*r)return true}return false}
function move(o,dx,dy){if(!hit(o.px+dx,o.py,o.r))o.px+=dx;if(!hit(o.px,o.py+dy,o.r))o.py+=dy}
function astar(sx,sy,gx,gy){const s={a:Math.floor(sx/S),b:Math.floor(sy/S)},q={a:Math.floor(gx/S),b:Math.floor(gy/S)};if(blocked(q.a,q.b))return[];const k=(a,b)=>a+','+b,o=[s],came=new Map(),cost=new Map([[k(s.a,s.b),0]]),h=(a,b)=>Math.abs(a-q.a)+Math.abs(b-q.b);let guard=0;while(o.length&&guard++<6000){o.sort((u,v)=>(cost.get(k(u.a,u.b))+h(u.a,u.b))-(cost.get(k(v.a,v.b))+h(v.a,v.b)));const z=o.shift();if(z.a===q.a&&z.b===q.b){const out=[z];let zkey=k(z.a,z.b);while(came.has(zkey)){const old=came.get(zkey);out.push(old);zkey=k(old.a,old.b)}return out.reverse()}for(const [da,db] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=z.a+da,b=z.b+db;if(blocked(a,b))continue;const nk=k(a,b),nc=cost.get(k(z.a,z.b))+1;if(!cost.has(nk)||nc<cost.get(nk)){cost.set(nk,nc);came.set(nk,z);if(!o.some(v=>v.a===a&&v.b===b))o.push({a,b})}}}return[]}
function visible(){const dx=p.px-g.px,dy=p.py-g.py,d=Math.hypot(dx,dy);if(p.hidden||d>650)return false;for(let i=1;i<d;i+=10){const qx=g.px+dx*i/d,qy=g.py+dy*i/d;if(blocked(Math.floor(qx/S),Math.floor(qy/S)))return false}return true}
function interact(){if(!playing||dead)return;let best=null,bd=75;for(const d of doors){const qx=(d.a+.5)*S,qy=(d.b+.5)*S,z=Math.hypot(p.px-qx,p.py-qy);if(z<bd){bd=z;best=d}}if(best){best.o=!best.o;status.textContent=best.o?'Door opened':'Door closed';return}if(Math.hypot(p.px-g.px,p.py-g.py)<110){p.hidden=true;status.textContent='You are hiding...'}}
function reset(){p.px=6.5*S;p.py=5*S;p.hidden=false;dead=false;g.px=19*S;g.py=15*S;g.mode='search';g.path=[];g.pi=0;g.room=0;g.until=0;noise=0;status.textContent='Move quietly...';last=performance.now()}
function player(dt){let a=0,b=0;if(keys.KeyW||keys.ArrowUp)b--;if(keys.KeyS||keys.ArrowDown)b++;if(keys.KeyA||keys.ArrowLeft)a--;if(keys.KeyD||keys.ArrowRight)a++;p.moving=!!(a||b);if(!p.moving){noise=Math.max(0,noise-dt*4);return}const l=Math.hypot(a,b);a/=l;b/=l;const run=keys.ShiftLeft||keys.ShiftRight,sp=p.speed*(run?1.7:1);move(p,a*sp*dt,b*sp*dt);p.hidden=false;noise=run?1:0.65}
function chase(){g.mode='chase';g.until=performance.now()+11000;g.path=[];status.textContent='GRANNY HEARD YOU! RUN!'}
function granny(dt){if(dead)return;const d=Math.hypot(p.px-g.px,p.py-g.py),see=visible();if(p.moving&&noise&&d<620&&(see||d<280)){if(g.mode!=='chase')chase();g.until=performance.now()+11000}if(g.mode==='chase'&&performance.now()>g.until){g.mode='search';g.path=[];g.room=0;status.textContent='Granny is searching...'}if(g.mode==='chase'&&see)g.path=astar(g.px,g.py,p.px,p.py),g.pi=0;if(g.mode==='search'&&(!g.path.length||g.pi>=g.path.length)){const r=rooms[g.room++%rooms.length];g.path=astar(g.px,g.py,(r[1]+r[3]/2)*S,(r[2]+r[4]/2)*S);g.pi=0}if(g.path.length){const n=g.path[Math.min(g.pi,g.path.length-1)],tx=(n.a+.5)*S,ty=(n.b+.5)*S,dx=tx-g.px,dy=ty-g.py,dd=Math.hypot(dx,dy);if(dd<9)g.pi++;else{const sp=g.speed*(g.mode==='chase'?1.15:.7);move(g,dx/dd*sp*dt,dy/dd*sp*dt)}}if(d<27&&!p.hidden){dead=true;status.textContent='GRANNY CAUGHT YOU! PRESS R';}}
function draw(){const camX=p.px-W/2,camY=p.py-H/2;x.fillStyle='#080706';x.fillRect(0,0,W,H);const xa=Math.floor(camX/S)-2,xb=Math.ceil((camX+W)/S)+2,ya=Math.floor(camY/S)-2,yb=Math.ceil((camY+H)/S)+2;for(let j=ya;j<yb;j++)for(let i=xa;i<xb;i++){if(i<0||j<0||i>=C||j>=R)continue;const sx=i*S-camX,sy=j*S-camY;x.fillStyle=grid[j][i]?'#332a26':'#171514';x.fillRect(sx,sy,S+1,S+1);if(grid[j][i]){x.strokeStyle='#57443b';x.strokeRect(sx+.5,sy+.5,S-1,S-1)}}for(const d of doors){const sx=d.a*S-camX,sy=d.b*S-camY;x.fillStyle=d.o?'#80634e':'#633a2c';x.fillRect(sx+4,sy+4,S-8,S-8)}for(const r of rooms){x.fillStyle='#ffffff12';x.font='12px Arial';x.textAlign='center';x.fillText(r[0],(r[1]+r[3]/2)*S-camX,(r[2]+r[4]/2)*S-camY)}drawGuy(p,camX,camY,'#b8d6e8');if(!p.hidden)drawGuy(g,camX,camY,'#bfa0a0');if(dead){x.fillStyle='#9008';x.fillRect(0,0,W,H)}}
function drawGuy(o,cx,cy,col){x.fillStyle='#0009';x.beginPath();x.arc(o.px-cx,o.py-cy,o.r+5,0,7);x.fill();x.fillStyle=col;x.beginPath();x.arc(o.px-cx,o.py-cy,o.r,0,7);x.fill();}
function miniMap(){mx.clearRect(0,0,190,150);const sc=4;for(let j=0;j<R;j++)for(let i=0;i<C;i++){mx.fillStyle=grid[j][i]?'#302622':'#151312';mx.fillRect(i*sc,j*sc,sc,sc)}for(const d of doors){mx.fillStyle=d.o?'#99735a':'#57352b';mx.fillRect(d.a*sc,d.b*sc,sc,sc)}mx.fillStyle='#9cf';mx.fillRect(p.px/S*sc-3,p.py/S*sc-3,6,6);mx.fillStyle='#e55';mx.fillRect(g.px/S*sc-3,g.py/S*sc-3,6,6)}
function loop(){const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;if(playing){player(dt);granny(dt)}draw();miniMap();requestAnimationFrame(loop)}
document.getElementById('start').onclick=()=>{document.getElementById('menu').style.display='none';playing=true;reset()};loop();
</script></body></html>
