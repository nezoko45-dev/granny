<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Granny House Hunt</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:white;font-family:Arial}canvas{display:block}#error{position:fixed;inset:0;display:none;place-items:center;background:#050505;color:#fff;font-size:20px;text-align:center;padding:30px}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}#status{position:absolute;top:15px;left:15px;font-size:18px}#timer{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-size:20px}#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#000b;padding:8px 12px;border-radius:7px}#cross{position:absolute;left:50%;top:50%;font-size:24px;transform:translate(-50%,-50%)}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r161/three.min.js"></script></head><body><div id="error">Three.js failed to load.<br>Refresh the page and make sure your browser is online.</div><div id="hud"><div id="status">LOADING...</div><div id="timer"></div><div id="cross">+</div><div id="help">WASD MOVE · MOUSE LOOK · SHIFT SPRINT · R RESTART</div></div><script>
'use strict';
let scene,camera,renderer,granny,yaw=0,pitch=0,last=performance.now(),moving=false,chasing=false,chaseLeft=0,target=new THREE.Vector3();const keys={},walls=[];
function mat(c){return new THREE.MeshStandardMaterial({color:c})}function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}function wall(x,z,w,d){box(x,2,z,w,4,d,0x4d403b);walls.push({x,z,w,d})}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x070707);scene.fog=new THREE.Fog(0x070707,7,75);camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,120);camera.position.set(0,1.65,18);camera.rotation.order='YXZ';renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.domElement.tabIndex=0;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbfc7d5,0x211915,1.5));const light=new THREE.DirectionalLight(0xffd8bd,1.2);light.position.set(5,15,8);light.castShadow=true;scene.add(light);box(0,-.15,-10,50,.3,70,0x302824);wall(0,-45,50,1);wall(-25,-10,1,70);wall(25,-10,1,70);wall(0,25,50,1);wall(-12,5,1,20);wall(12,5,1,20);wall(-12,-20,1,28);wall(12,-20,1,28);wall(-7,-10,10,1);wall(7,-10,10,1);wall(-15,-32,18,1);wall(15,-32,18,1);wall(0,-39,18,1);wall(-20,-25,10,1);wall(20,-25,10,1);box(-7,1,-2,4,2,2,0x5b3b29);box(7,1,-2,4,2,2,0x5b3b29);box(-18,1,-18,4,2,2,0x282323);box(18,1,-18,4,2,2,0x282323);box(0,1,-29,5,2,2,0x3b302d);granny=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.25,6,12),mat(0x40343a));body.position.y=1;granny.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.46,18,12),mat(0xd2aaa0));head.position.y=2.05;granny.add(head);const eyeMat=mat(0x990000);for(const x of [-.16,.16]){const e=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),eyeMat);e.position.set(x,2.12,-.4);granny.add(e)}granny.position.set(0,0,-24);scene.add(granny);addEventListener('keydown',e=>{keys[e.code]=true;if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR')restart()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock?.());addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch-=e.movementY*.0025;pitch=Math.max(-1.3,Math.min(1.3,pitch));camera.rotation.y=yaw;camera.rotation.x=pitch}})}
function blocked(x,z){return walls.some(w=>x>w.x-w.w/2-.45&&x<w.x+w.w/2+.45&&z>w.z-w.d/2-.45&&z<w.z+w.d/2+.45)}function move(dt){let x=(keys.KeyD?1:0)-(keys.KeyA?1:0),z=(keys.KeyS?1:0)-(keys.KeyW?1:0);moving=!!(x||z);if(!moving)return;const n=Math.hypot(x,z);x/=n;z/=n;const sp=keys.ShiftLeft||keys.ShiftRight?7:4,c=Math.cos(yaw),s=Math.sin(yaw),dx=(x*c+z*s)*sp*dt,dz=(-x*s+z*c)*sp*dt,nx=camera.position.x+dx,nz=camera.position.z+dz;if(!blocked(nx,camera.position.z))camera.position.x=nx;if(!blocked(camera.position.x,nz))camera.position.z=nz;camera.position.x=Math.max(-23,Math.min(23,camera.position.x));camera.position.z=Math.max(-43,Math.min(23,camera.position.z))}function visible(){const a=new THREE.Vector3(granny.position.x,1.4,granny.position.z),b=new THREE.Vector3(camera.position.x,1.4,camera.position.z),d=b.clone().sub(a),dist=d.length();if(dist>38)return false;const hits=new THREE.Raycaster(a,d.normalize(),0,dist).intersectObjects(scene.children,true);return !hits.some(h=>h.object!==granny&&h.object.parent!==granny)}function grannyAI(dt){const dist=granny.position.distanceTo(camera.position);if(moving&&dist<48){chasing=true;chaseLeft=11;target.copy(camera.position)}if(chasing){chaseLeft-=dt;target.copy(camera.position);if(chaseLeft<=0)chasing=false}else if(visible()&&dist<35){chasing=true;chaseLeft=11;target.copy(camera.position)}const speed=chasing?4.2:.9;if(!chasing&&dist>12)return;let dx=target.x-granny.position.x,dz=target.z-granny.position.z,d=Math.hypot(dx,dz);if(d>.2){dx/=d;dz/=d;const nx=granny.position.x+dx*speed*dt,nz=granny.position.z+dz*speed*dt;if(!blocked(nx,granny.position.z))granny.position.x=nx;if(!blocked(granny.position.x,nz))granny.position.z=nz;granny.rotation.y=Math.atan2(dx,dz)}if(dist<1.35){chasing=false;document.getElementById('status').textContent='GRANNY CAUGHT YOU — PRESS R'}}function restart(){camera.position.set(0,1.65,18);yaw=pitch=0;camera.rotation.set(0,0,0);granny.position.set(0,0,-24);chasing=false;chaseLeft=0}function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;move(dt);grannyAI(dt);document.getElementById('status').textContent=chasing?'GRANNY IS CHASING YOU!':moving?'GRANNY HEARD YOU':'QUIET';document.getElementById('timer').textContent=chasing?'CHASE: '+Math.max(0,chaseLeft).toFixed(1)+'s':'';renderer.render(scene,camera)}
if(typeof THREE==='undefined'){document.getElementById('error').style.display='grid';document.getElementById('hud').style.display='none'}else{try{init();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop()}catch(e){console.error(e);document.getElementById('error').style.display='grid';document.getElementById('hud').style.display='none'}}
</script></body></html>
