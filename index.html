<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRANNY 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;color:white;font-family:Arial}canvas{display:block}#menu{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#090605}#panel{background:#1a1210;padding:35px;border-radius:16px;text-align:center;width:min(500px,85vw)}button{padding:15px 28px;font-size:20px;font-weight:bold;border:0;border-radius:8px;cursor:pointer}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}#status{position:absolute;top:15px;left:15px;font-size:20px}#debug{position:absolute;top:15px;right:15px;font-size:13px}#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#000b;padding:9px;border-radius:8px}</style></head><body><div id="menu"><div id="panel"><h1>GRANNY</h1><h2>3D HOUSE HUNT</h2><p>WASD or arrow keys to move. Mouse to look.</p><button id="start">ENTER THE HOUSE</button></div></div><div id="hud"><div id="status"></div><div id="debug"></div><div id="help">WASD = MOVE | MOUSE = LOOK | SHIFT = SPRINT | R = RESTART</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script><script>
'use strict';
let scene,camera,renderer,started=false,dead=false,yaw=0,pitch=0,last=performance.now(),moving=false;
const keys={};
function init(){
 if(typeof THREE==='undefined'){document.getElementById('status').textContent='Three.js failed to load. Check internet/CDN access.';return false}
 scene=new THREE.Scene();scene.background=new THREE.Color(0x090909);scene.fog=new THREE.Fog(0x090909,8,90);
 camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,150);camera.position.set(0,1.65,8);camera.rotation.order='YXZ';
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x222222,1.5));let l=new THREE.DirectionalLight(0xffe0c0,1.4);l.position.set(10,25,10);l.castShadow=true;scene.add(l);
 const floor=new THREE.Mesh(new THREE.BoxGeometry(50,.3,80),new THREE.MeshStandardMaterial({color:0x332b28}));floor.position.set(0,-.15,-10);floor.receiveShadow=true;scene.add(floor);
 const wallMat=new THREE.MeshStandardMaterial({color:0x51433d});
 function wall(x,z,w,d){let m=new THREE.Mesh(new THREE.BoxGeometry(w,4,d),wallMat);m.position.set(x,2,z);m.castShadow=m.receiveShadow=true;scene.add(m)}
 wall(0,-50,52,1);wall(-26,-10,1,80);wall(26,-10,1,80);wall(0,30,52,1);
 // Interior room walls with generous door openings.
 wall(-15,5,1,30);wall(15,5,1,30);wall(0,-15,30,1);wall(0,0,12,1);wall(-20,-30,12,1);wall(20,-30,12,1);
 // furniture
 function cube(x,y,z,w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m)}
 cube(-9,1,-5,4,2,2,0x553526);cube(9,1,-5,4,2,2,0x553526);cube(-18,1,-20,3,2,2,0x292020);cube(18,1,-20,3,2,2,0x292020);
 // Granny
 window.granny=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.6,1.3,6,12),new THREE.MeshStandardMaterial({color:0x40353b}));body.position.y=1;granny.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),new THREE.MeshStandardMaterial({color:0xd0aaa0}));head.position.y=2.05;granny.add(head);granny.position.set(0,0,-20);scene.add(granny);
 addEventListener('keydown',e=>{keys[e.code]=true;if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR')restart()},{passive:false});
 addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
 renderer.domElement.addEventListener('click',()=>{if(started&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock()});
 addEventListener('mousemove',e=>{if(started&&document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch-=e.movementY*.0025;pitch=Math.max(-1.3,Math.min(1.3,pitch));camera.rotation.y=yaw;camera.rotation.x=pitch}});
 return true
}
function move(dt){let x=(keys.KeyD?1:0)-(keys.KeyA?1:0)+(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);let z=(keys.KeyS?1:0)-(keys.KeyW?1:0)+(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);moving=x!==0||z!==0;if(!moving)return;let n=Math.hypot(x,z);x/=n;z/=n;let sp=(keys.ShiftLeft||keys.ShiftRight)?7:4;let c=Math.cos(yaw),s=Math.sin(yaw);camera.position.x+= (x*c+z*s)*sp*dt;camera.position.z+=(-x*s+z*c)*sp*dt;camera.position.x=Math.max(-24,Math.min(24,camera.position.x));camera.position.z=Math.max(-48,Math.min(28,camera.position.z))}
function restart(){camera.position.set(0,1.65,8);yaw=0;pitch=0;dead=false;document.getElementById('status').textContent='Move quietly...'}
function loop(){requestAnimationFrame(loop);let now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;if(started&&!dead)move(dt);document.getElementById('debug').textContent='X '+camera.position.x.toFixed(1)+' | Z '+camera.position.z.toFixed(1)+' | '+(moving?'MOVING':'STILL');renderer.render(scene,camera)}
if(init()){document.getElementById('start').onclick=()=>{started=true;document.getElementById('menu').style.display='none';restart();renderer.domElement.requestPointerLock?.()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop()}
</script></body></html>
