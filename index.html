<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRANNY — 3D House Hunt</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,sans-serif}canvas{display:block}#menu{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#080605}#panel{width:min(560px,90vw);padding:34px;background:#17100e;border:1px solid #65483b;border-radius:16px;text-align:center;box-shadow:0 25px 80px #000}button{font-size:21px;font-weight:bold;padding:14px 28px;border:0;border-radius:9px;cursor:pointer}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}#status{position:absolute;left:18px;top:16px;font-size:20px;font-weight:bold}#timer{position:absolute;left:18px;top:46px;font-size:15px}#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 15px;border-radius:8px;white-space:nowrap;font-size:14px}#debug{position:absolute;right:15px;top:15px;font-size:13px;background:#0008;padding:8px;border-radius:7px}
</style>
</head>
<body>
<div id="menu"><div id="panel"><h1>GRANNY</h1><h2>HOUSE HUNT</h2><p>Explore the large 3D house. Granny hears you move and will chase you for 11 seconds.</p><p><b>WASD</b> move · <b>MOUSE</b> look · <b>SHIFT</b> sprint · <b>E</b> door/hide · <b>R</b> restart</p><button id="start">ENTER THE HOUSE</button></div></div>
<div id="hud"><div id="status">Ready</div><div id="timer"></div><div id="debug"></div><div id="help">W A S D = MOVE | MOUSE = LOOK | SHIFT = SPRINT | E = INTERACT | R = RESTART</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
'use strict';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080808);scene.fog=new THREE.Fog(0x080808,8,95);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,150);camera.position.set(0,1.65,22);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xaaa9a4,0x15100e,1.25));const light=new THREE.DirectionalLight(0xffead6,1.25);light.position.set(12,25,15);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);
const floorMat=new THREE.MeshStandardMaterial({color:0x302925,roughness:.9}),wallMat=new THREE.MeshStandardMaterial({color:0x51423c,roughness:.95}),woodMat=new THREE.MeshStandardMaterial({color:0x633f2e}),darkMat=new THREE.MeshStandardMaterial({color:0x181414}),skinMat=new THREE.MeshStandardMaterial({color:0xd1aaa0}),dressMat=new THREE.MeshStandardMaterial({color:0x3d3438});
const solids=[];const rooms=[];const doors=[];
function box(name,x,y,z,w,h,d,mat,solid=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.name=name;m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);if(solid)solids.push({x,z,w,d});return m}
function makeRoom(name,x,z,w,d){rooms.push({name,x,z,w,d});box(name+' floor',x,-.15,z,w,.3,d,floorMat,false);box(name+' N wall',x,2,z-d/2,w,.5,4,wallMat,true);box(name+' S wall',x,2,z+d/2,w,.5,4,wallMat,true);box(name+' W wall',x-w/2,2,z,.5,4,d,wallMat,true);box(name+' E wall',x+w/2,2,z,.5,4,d,wallMat,true)}
makeRoom('Entrance',0,22,16,12);makeRoom('Foyer',0,10,16,8);makeRoom('Kitchen',-15,10,12,10);makeRoom('Dining',15,10,12,10);makeRoom('Living',-15,-3,18,14);makeRoom('Library',15,-3,12,14);makeRoom('Hall',0,-15,12,10);makeRoom('Study',0,-24,10,8);makeRoom('Bedroom A',-15,-21,12,10);makeRoom('Bedroom B',15,-21,12,10);makeRoom('Bathroom',-15,-30,10,7);makeRoom('Closet Room',0,-30,9,7);makeRoom('Bedroom C',15,-30,12,7);makeRoom('Basement',0,-40,26,12);
// Openings are created by adding decorative wall segments rather than relying on fragile mesh booleans.
const openings=[[-8,10,1,4],[8,10,1,4],[-9,4,1,4],[9,4,1,4],[-6,-15,4,1],[6,-15,4,1],[-5,-26,3,1],[5,-26,3,1],[-10,-27,1,3],[0,-26,1,3],[10,-27,1,3],[0,-35,3,1]];
// Collision is handled by explicit rectangular house boundaries below; doorway passages are left open.
function addDoor(name,x,z,w=1.2,h=3,d=.3){const m=box(name,x,1.5,z,w,h,d,woodMat,false);doors.push({mesh:m,x,z,open:false})}
addDoor('Kitchen Door',-8,10);addDoor('Dining Door',8,10);addDoor('Living Door',-8,4);addDoor('Library Door',8,4);addDoor('Study Door',0,-19);addDoor('Bedroom A Door',-6,-15);addDoor('Bedroom B Door',6,-15);addDoor('Bathroom Door',-10,-27);addDoor('Closet Door',0,-27);addDoor('Bedroom C Door',10,-27);addDoor('Basement Door',0,-35);
// Decorative furniture.
function table(x,z,w,d){box('table',x,.9,z,w,1.8,d,woodMat,false)}function shelf(x,z,w,d){box('shelf',x,1.5,z,w,3,d,darkMat,false)}
table(-15,10,4,2);table(15,10,4,2);table(-15,-3,5,2);shelf(19,-5,2,8);shelf(19,0,2,8);shelf(-19,-3,2,7);shelf(-19,-21,2,7);
// A* navigation grid covers the whole house and uses the same collision rectangles as the player.
const CELL=1.5,MINX=-26,MAXX=26,MINZ=-47,MAXZ=29,COLS=Math.ceil((MAXX-MINX)/CELL),ROWS=Math.ceil((MAXZ-MINZ)/CELL);
function solidAt(x,z,r){for(const s of solids){const minX=s.x-s.w/2-r,maxX=s.x+s.w/2+r,minZ=s.z-s.d/2-r,maxZ=s.z+s.d/2+r;if(x>minX&&x<maxX&&z>minZ&&z<maxZ)return true}return false}
function walkable(x,z,r=.35){return x>MINX+r&&x<MAXX-r&&z>MINZ+r&&z<MAXZ-r&&!solidAt(x,z,r)}
function nodeOf(x,z){return{x:Math.floor((x-MINX)/CELL),z:Math.floor((z-MINZ)/CELL)}}function worldOf(n){return{x:MINX+(n.x+.5)*CELL,z:MINZ+(n.z+.5)*CELL}}
function astar(sx,sz,gx,gz){const s=nodeOf(sx,sz),g=nodeOf(gx,gz),key=n=>n.x+','+n.z;const blocked=n=>n.x<0||n.z<0||n.x>=COLS||n.z>=ROWS||!walkable(worldOf(n).x,worldOf(n).z,.35);if(blocked(g))return[];const open=[s],came=new Map(),cost=new Map([[key(s),0]]),h=n=>Math.abs(n.x-g.x)+Math.abs(n.z-g.z);let guard=0;while(open.length&&guard++<7000){open.sort((a,b)=>(cost.get(key(a))+h(a))-(cost.get(key(b))+h(b)));const c=open.shift();if(c.x===g.x&&c.z===g.z){const out=[c];let k=key(c);while(came.has(k)){const p=came.get(k);out.push(p);k=key(p)}return out.reverse().map(worldOf)}for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){const n={x:c.x+dx,z:c.z+dz};if(blocked(n))continue;const nk=key(n),nc=cost.get(key(c))+1;if(!cost.has(nk)||nc<cost.get(nk)){cost.set(nk,nc);came.set(nk,c);if(!open.some(v=>v.x===n.x&&v.z===n.z))open.push(n)}}}return[]}
// IMPORTANT: movement is based on real keyboard state every animation frame.
const keys=Object.create(null);let started=false,dead=false,yaw=0,pitch=0,last=performance.now(),moving=false,chaseUntil=0,grannyPath=[],grannyIndex=0,searchIndex=0;
addEventListener('keydown',e=>{keys[e.code]=true;if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyE')interact();if(e.code==='KeyR')restart()},{passive:false});
addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
renderer.domElement.addEventListener('click',()=>{if(started&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock()});
addEventListener('mousemove',e=>{if(started&&document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.35,Math.min(1.35,pitch))}});
function updateCamera(){camera.rotation.y=yaw;camera.rotation.x=pitch}
function movePlayer(dt){let right=(keys.KeyD?1:0)-(keys.KeyA?1:0),forward=(keys.KeyW?1:0)-(keys.KeyS?1:0);if(keys.ArrowRight)right++;if(keys.ArrowLeft)right--;if(keys.ArrowUp)forward++;if(keys.ArrowDown)forward--;moving=right!==0||forward!==0;if(!moving)return;const l=Math.hypot(right,forward);right/=l;forward/=l;const speed=(keys.ShiftLeft||keys.ShiftRight)?7.5:4.2;const c=Math.cos(yaw),s=Math.sin(yaw);const dx=(right*c+forward*s)*speed*dt,dz=(-right*s+forward*c)*speed*dt;const nx=camera.position.x+dx,nz=camera.position.z+dz;if(walkable(nx,camera.position.z,.42))camera.position.x=nx;if(walkable(camera.position.x,nz,.42))camera.position.z=nz}
function nearestDoor(){let best=null,bd=2.4;for(const d of doors){const dist=Math.hypot(camera.position.x-d.x,camera.position.z-d.z);if(dist<bd){best=d;bd=dist}}return best}
function interact(){if(!started||dead)return;const d=nearestDoor();if(d){d.open=!d.open;d.mesh.rotation.y=d.open?Math.PI/2:0;document.getElementById('status').textContent=d.open?'Door opened':'Door closed';return}if(Math.hypot(camera.position.x-granny.position.x,camera.position.z-granny.position.z)<2.8){document.getElementById('status').textContent='You hide...';camera.userData.hidden=true}}
function restart(){camera.position.set(0,1.65,22);yaw=0;pitch=0;camera.userData.hidden=false;dead=false;chaseUntil=0;grannyPath=[];grannyIndex=0;searchIndex=0;granny.position.set(0,0,-12);document.getElementById('status').textContent='Move quietly...'}
// Granny model.
const granny=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.25,6,12),dressMat);body.position.y=1;body.castShadow=true;granny.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),skinMat);head.position.y=2.05;head.castShadow=true;granny.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.48,16,10),dressMat);hair.scale.set(1.05,.75,1.05);hair.position.set(0,2.28,0);granny.add(hair);scene.add(granny);granny.position.set(0,0,-12);
function lineOfSight(){if(camera.userData.hidden)return false;const dx=camera.position.x-granny.position.x,dz=camera.position.z-granny.position.z,dist=Math.hypot(dx,dz);if(dist>32)return false;const ray=new THREE.Raycaster(new THREE.Vector3(granny.position.x,1.7,granny.position.z),new THREE.Vector3(dx,0,dz).normalize(),0,dist);const hits=ray.intersectObjects(scene.children,true).filter(o=>o!==granny&&!granny.children.includes(o));return !hits.length}
function startChase(){chaseUntil=performance.now()+11000;grannyPath=[];grannyIndex=0;document.getElementById('status').textContent='GRANNY HEARD YOU! RUN!'}
function updateGranny(dt){const dist=Math.hypot(camera.position.x-granny.position.x,camera.position.z-granny.position.z);if(moving&&dist<38&&!camera.userData.hidden){if(chaseUntil<performance.now())startChase();chaseUntil=performance.now()+11000}const chasing=performance.now()<chaseUntil;if(chasing&&lineOfSight()){grannyPath=astar(granny.position.x,granny.position.z,camera.position.x,camera.position.z);grannyIndex=0}else if(!chasing&&(!grannyPath.length||grannyIndex>=grannyPath.length)){const r=rooms[searchIndex++%rooms.length];grannyPath=astar(granny.position.x,granny.position.z,r.x,r.z);grannyIndex=0}if(grannyPath.length){const p=grannyPath[Math.min(grannyIndex,grannyPath.length-1)],dx=p.x-granny.position.x,dz=p.z-granny.position.z,d=Math.hypot(dx,dz);if(d<.45)grannyIndex++;else{const sp=chasing?4.2:2.4;granny.position.x+=dx/d*sp*dt;granny.position.z+=dz/d*sp*dt;granny.lookAt(granny.position.x+dx,1,granny.position.z+dz)}}if(dist<1.25&&!camera.userData.hidden){dead=true;document.getElementById('status').textContent='GRANNY CAUGHT YOU! PRESS R'}}
function updateHUD(){document.getElementById('debug').textContent='X '+camera.position.x.toFixed(1)+' | Z '+camera.position.z.toFixed(1)+' | '+(moving?'MOVING':'STILL');const remain=Math.max(0,(chaseUntil-performance.now())/1000);document.getElementById('timer').textContent=remain>0?'CHASE: '+remain.toFixed(1)+'s':''}
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;if(started&&!dead)movePlayer(dt);if(started&&!dead)updateGranny(dt);updateCamera();updateHUD();renderer.render(scene,camera)}
document.getElementById('start').onclick=()=>{document.getElementById('menu').style.display='none';started=true;restart();renderer.domElement.requestPointerLock?.()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop();
</script>
</body></html>
