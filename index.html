<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Granny 2D House Hunt</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:auto}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}#status{position:absolute;top:12px;left:12px;font-size:18px}#timer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:20px}#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#000b;padding:7px 10px;border-radius:6px}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="status">QUIET</div><div id="timer"></div><div id="cross">+</div><div id="help">WASD MOVE · SHIFT SPRINT · R RESTART</div></div><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),keys={};let W=0,H=0,last=performance.now(),gameOver=false,chasing=false,chaseLeft=0,moving=false,yaw=0;
const player={x:0,z:18,r:.38,speed:4};const granny={x:0,z:-24,r:.48,speed:2.2};
const walls=[
{x:-25,z:-10,w:1,d:70},{x:25,z:-10,w:1,d:70},{x:0,z:25,w:50,d:1},{x:0,z:-45,w:50,d:1},
{x:-12,z:5,w:1,d:20},{x:12,z:5,w:1,d:20},{x:-12,z:-20,w:1,d:28},{x:12,z:-20,w:1,d:28},
{x:-7,z:-10,w:10,d:1},{x:7,z:-10,w:10,d:1},{x:-15,z:-32,w:18,d:1},{x:15,z:-32,w:18,d:1},
{x:0,z:-39,w:18,d:1},{x:-20,z:-25,w:10,d:1},{x:20,z:-25,w:10,d:1}
];
const furniture=[{x:-7,z:-2,w:4,d:2},{x:7,z:-2,w:4,d:2},{x:-18,z:-18,w:4,d:2},{x:18,z:-18,w:4,d:2},{x:0,z:-29,w:5,d:2}];
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')restart();if(['KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
function hitWall(x,z,r){for(const w of walls){const cx=Math.max(w.x-w.w/2,Math.min(x,w.x+w.w/2)),cz=Math.max(w.z-w.d/2,Math.min(z,w.z+w.d/2));if((x-cx)**2+(z-cz)**2<r*r)return true}for(const w of furniture){const cx=Math.max(w.x-w.w/2,Math.min(x,w.x+w.w/2)),cz=Math.max(w.z-w.d/2,Math.min(z,w.z+w.d/2));if((x-cx)**2+(z-cz)**2<r*r)return true}return false}
function movePlayer(dt){let x=(keys.KeyD?1:0)-(keys.KeyA?1:0),z=(keys.KeyS?1:0)-(keys.KeyW?1:0);moving=!!(x||z);if(!moving)return;let n=Math.hypot(x,z);x/=n;z/=n;let sp=(keys.ShiftLeft||keys.ShiftRight)?7:4;let nx=player.x+x*sp*dt,nz=player.z+z*sp*dt;if(!hitWall(nx,player.z,player.r))player.x=nx;if(!hitWall(player.x,nz,player.r))player.z=nz;player.x=Math.max(-24,Math.min(24,player.x));player.z=Math.max(-44,Math.min(24,player.z))}
function hear(){return moving&&Math.hypot(player.x-granny.x,player.z-granny.z)<48}
function hasLOS(){let dx=player.x-granny.x,dz=player.z-granny.z,d=Math.hypot(dx,dz);if(d>38)return false;let steps=Math.ceil(d/.35);for(let i=1;i<steps;i++){let x=granny.x+dx*i/steps,z=granny.z+dz*i/steps;if(hitWall(x,z,.12))return false}return true}
function ai(dt){let d=Math.hypot(player.x-granny.x,player.z-granny.z);if(hear()){chasing=true;chaseLeft=11}if(chasing){chaseLeft-=dt;if(chaseLeft<=0)chasing=false}if(!chasing&&hasLOS()&&d<35){chasing=true;chaseLeft=11}let sp=chasing?4.2:0;if(sp){let dx=(player.x-granny.x)/Math.max(d,.001),dz=(player.z-granny.z)/Math.max(d,.001),nx=granny.x+dx*sp*dt,nz=granny.z+dz*sp*dt;if(!hitWall(nx,granny.z,granny.r))granny.x=nx;if(!hitWall(granny.x,nz,granny.r))granny.z=nz}if(d<.9){gameOver=true;chasing=false}}
function restart(){player.x=0;player.z=18;granny.x=0;granny.z=-24;gameOver=false;chasing=false;chaseLeft=0}
function worldToScreen(x,z){const scale=Math.min((W-80)/50,(H-100)/70);return{x:W/2+(x-player.x)*scale,y:H/2+(z-player.z)*scale,s:scale}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#1b1715';ctx.fillRect(0,0,W,H);const scale=Math.min((W-80)/50,(H-100)/70);ctx.save();ctx.translate(W/2-player.x*scale,H/2-player.z*scale);ctx.fillStyle='#3a302b';ctx.fillRect(-25*scale,-45*scale,50*scale,70*scale);for(const w of walls){ctx.fillStyle='#66534b';ctx.fillRect((w.x-w.w/2)*scale,(w.z-w.d/2)*scale,w.w*scale,w.d*scale)}for(const f of furniture){ctx.fillStyle='#302625';ctx.fillRect((f.x-f.w/2)*scale,(f.z-f.d/2)*scale,f.w*scale,f.d*scale)}ctx.fillStyle='#4d7d4d';ctx.beginPath();ctx.arc(granny.x*scale,granny.z*scale,.75*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8aaa0';ctx.beginPath();ctx.arc(granny.x*scale,granny.z*scale,.42*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9d1111';ctx.beginPath();ctx.arc((granny.x-.14)*scale,(granny.z-.34)*scale,.055*scale,0,Math.PI*2);ctx.arc((granny.x+.14)*scale,(granny.z-.34)*scale,.055*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3f78c8';ctx.beginPath();ctx.arc(player.x*scale,player.z*scale,player.r*scale,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.fillText('YOU',W/2+12,H/2+5)}
function loop(){requestAnimationFrame(loop);let now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;if(!gameOver){movePlayer(dt);ai(dt)}document.getElementById('status').textContent=gameOver?'GRANNY CAUGHT YOU — PRESS R':chasing?'GRANNY IS CHASING YOU!':moving?'GRANNY HEARD YOU':'QUIET';document.getElementById('timer').textContent=chasing?'CHASE: '+Math.max(0,chaseLeft).toFixed(1)+'s':'';draw()}loop();
</script></body></html>
