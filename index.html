<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Granny 2D</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial}#game{width:100%;height:100%;display:block;background:#17110e;image-rendering:auto}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000}#status{position:absolute;top:15px;left:15px;font-size:20px;font-weight:bold}#timer{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:bold}#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#000c;padding:9px 13px;border-radius:7px;font-size:14px}#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;color:#fff;font-size:28px;font-weight:bold;pointer-events:auto;cursor:pointer}#start span{background:#000d;padding:18px 24px;border:2px solid #fff;border-radius:10px}.hidden{display:none!important}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="status">QUIET</div><div id="timer"></div><div id="help">WASD / ARROWS MOVE · SHIFT SPRINT · E HIDE · R RESTART</div></div><div id="start"><span>CLICK TO START</span></div><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),start=document.getElementById('start');
let W=innerWidth,H=innerHeight,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const WORLD={minX:-26,maxX:26,minZ:-45,maxZ:25};const walls=[];const furniture=[];const doors=[];
function rect(x,z,w,d){return{x:x-w/2,z:z-d/2,w,d}}function wall(x,z,w,d){walls.push(rect(x,z,w,d))}function furnitureBox(x,z,w,d){furniture.push(rect(x,z,w,d))}
wall(-26,-10,1,70);wall(26,-10,1,70);wall(0,25,52,1);wall(0,-45,52,1);wall(-12,5,1,20);wall(12,5,1,20);wall(-12,-20,1,28);wall(12,-20,1,28);wall(-7,-10,10,1);wall(7,-10,10,1);wall(-15,-32,18,1);wall(15,-32,18,1);wall(0,-39,18,1);wall(-20,-25,10,1);wall(20,-25,10,1);
furnitureBox(-7,-2,4,2);furnitureBox(7,-2,4,2);furnitureBox(-18,-18,4,2);furnitureBox(18,-18,4,2);furnitureBox(0,-29,5,2);
doors.push(rect(0,9,3,.5),rect(-12,-5,.5,3),rect(12,-5,.5,3),rect(0,-25,3,.5));
const player={x:0,z:18,r:.55,angle:0};const granny={x:0,z:-24,r:.65,angle:Math.PI};let keys={},hidden=false,chasing=false,chaseLeft=0,lastMove=0,gameOver=false,path=[],pathIndex=0,pathClock=0,started=false;
start.onclick=()=>{started=true;start.classList.add('hidden');canvas.focus()};canvas.tabIndex=0;
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR')restart();if(e.code==='KeyE')toggleHide()});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('blur',()=>keys={});
function hit(x,z,r=.55){for(const a of walls.concat(furniture)){if(x>a.x-r&&x<a.x+a.w+r&&z>a.z-r&&z<a.z+a.d+r)return true}return false}
function movePlayer(dt){if(!started||gameOver||hidden)return;let x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),z=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);if(!x&&!z)return;let l=Math.hypot(x,z);x/=l;z/=l;const speed=(keys.ShiftLeft||keys.ShiftRight)?9:5;const nx=player.x+x*speed*dt,nz=player.z+z*speed*dt;if(!hit(nx,player.z))player.x=nx;if(!hit(player.x,nz))player.z=nz;player.x=Math.max(WORLD.minX+1,Math.min(WORLD.maxX-1,player.x));player.z=Math.max(WORLD.minZ+1,Math.min(WORLD.maxZ-1,player.z));player.angle=Math.atan2(z,x);lastMove=performance.now()}
function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}
function blockedCell(x,z){return hit(x,z,.3)}
const CELL=1,MINX=-25,MINZ=-44,cols=51,rows=68;
function astar(start,target){const sx=Math.max(0,Math.min(cols-1,Math.round(start.x-MINX))),sz=Math.max(0,Math.min(rows-1,Math.round(start.z-MINZ))),tx=Math.max(0,Math.min(cols-1,Math.round(target.x-MINX))),tz=Math.max(0,Math.min(rows-1,Math.round(target.z-MINZ)));const open=[{x:sx,z:sz,g:0,f:0,p:null}],seen=new Map(),closed=new Set();let guard=0;while(open.length&&guard++<9000){open.sort((a,b)=>a.f-b.f);const c=open.shift(),k=c.x+','+c.z;if(closed.has(k))continue;closed.add(k);if(c.x===tx&&c.z===tz){const out=[];for(let p=c;p;p=p.p)out.unshift({x:MINX+p.x,z:MINZ+p.z});return out}for(const [dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]]){const x=c.x+dx,z=c.z+dz;if(x<0||z<0||x>=cols||z>=rows||blockedCell(MINX+x,MINZ+z))continue;const nk=x+','+z,g=c.g+1;if(seen.has(nk)&&seen.get(nk)<=g)continue;seen.set(nk,g);const h=Math.abs(x-tx)+Math.abs(z-tz);open.push({x,z,g,f:g+h,p:c})}}return[]}
function hear(){return !hidden&&performance.now()-lastMove<220&&dist(player,granny)<55}
function lineOfSight(){const d=dist(player,granny);if(d>42)return false;const steps=Math.ceil(d/.35);for(let i=1;i<steps;i++){const t=i/steps,x=player.x+(granny.x-player.x)*t,z=player.z+(granny.z-player.z)*t;if(hit(x,z,.15))return false}return true}
function toggleHide(){if(Math.abs(player.x)<4&&player.z>-33&&player.z<-26){hidden=!hidden;}}
function ai(dt){if(hidden){chasing=false;return}const d=dist(player,granny);if(hear()||(!chasing&&d<42&&lineOfSight())){chasing=true;chaseLeft=11}if(chasing){chaseLeft-=dt;if(chaseLeft<=0){chasing=false;path=[];return}pathClock-=dt;if(pathClock<=0||pathIndex>=path.length){path=astar(granny,player);pathIndex=1;pathClock=.25}const t=path[pathIndex];if(t){const dx=t.x-granny.x,dz=t.z-granny.z,l=Math.hypot(dx,dz)||1;const s=4.2*dt;granny.x+=dx/l*s;granny.z+=dz/l*s;granny.angle=Math.atan2(dz,dx);if(Math.hypot(dx,dz)<.35)pathIndex++}}if(d<1.25){gameOver=true;chasing=false}}
function restart(){player.x=0;player.z=18;player.angle=-Math.PI/2;granny.x=0;granny.z=-24;granny.angle=Math.PI/2;hidden=false;chasing=false;chaseLeft=0;path=[];pathIndex=0;gameOver=false;lastMove=0}
function camera(){const scale=Math.min(W/58,H/78);return{sx:W/2-player.x*scale,sy:H/2-player.z*scale,scale}}
function drawRect(r,c){const cam=camera();ctx.fillStyle=c;ctx.fillRect(cam.sx+r.x*cam.scale,cam.sy+r.z*cam.scale,r.w*cam.scale,r.d*cam.scale)}
function draw(){ctx.clearRect(0,0,W,H);const cam=camera();ctx.fillStyle='#4a3022';ctx.fillRect(0,0,W,H);for(let z=WORLD.minZ;z<WORLD.maxZ;z+=2)for(let x=WORLD.minX;x<WORLD.maxX;x+=2){ctx.fillStyle=((x+z)/2%2===0)?'#59402d':'#4e3828';ctx.fillRect(cam.sx+x*cam.scale,cam.sy+z*cam.scale,2*cam.scale,2*cam.scale)}for(const r of walls)drawRect(r,'#b88968');for(const r of furniture)drawRect(r,'#241812');for(const r of doors)drawRect(r,'#9a4d2e');
// closet highlight
const closet=rect(0,-29,7,5);drawRect(closet,'#38251e');
// granny
let gx=cam.sx+granny.x*cam.scale,gz=cam.sy+granny.z*cam.scale,gs=Math.max(18,1.7*cam.scale);ctx.save();ctx.translate(gx,gz);ctx.rotate(granny.angle);ctx.fillStyle='#3f9149';ctx.beginPath();ctx.arc(0,0,gs,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e0a18f';ctx.beginPath();ctx.arc(gs*.15,0,gs*.48,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f22';ctx.beginPath();ctx.arc(gs*.42,-gs*.18,gs*.09,0,Math.PI*2);ctx.arc(gs*.42,gs*.18,gs*.09,0,Math.PI*2);ctx.fill();ctx.restore();
// player
let px=cam.sx+player.x*cam.scale,pz=cam.sy+player.z*cam.scale,ps=Math.max(10,1.15*cam.scale);ctx.save();ctx.translate(px,pz);ctx.rotate(player.angle);ctx.fillStyle=hidden?'#555':'#3c8ee8';ctx.beginPath();ctx.arc(0,0,ps,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(ps+7,0);ctx.lineTo(ps-2,-5);ctx.lineTo(ps-2,5);ctx.closePath();ctx.fill();ctx.restore();
if(gameOver){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 34px Arial';ctx.fillText('GRANNY CAUGHT YOU',W/2,H/2-10);ctx.font='18px Arial';ctx.fillText('PRESS R TO RESTART',W/2,H/2+28)}
}
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;movePlayer(dt);ai(dt);document.getElementById('status').textContent=gameOver?'GRANNY CAUGHT YOU — PRESS R':hidden?'HIDDEN':chasing?'GRANNY IS CHASING YOU!':performance.now()-lastMove<220?'GRANNY HEARD YOU':'QUIET';document.getElementById('timer').textContent=chasing?'CHASE: '+Math.max(0,chaseLeft).toFixed(1)+'s':'';draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
